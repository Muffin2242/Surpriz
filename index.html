
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nisa'ya Doğum Günü Sürprizi</title>
<style>
:root{--pink:#ff4f91;--purple:#8b5cf6;--dark:#33213b}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  display:flex; justify-content:center; align-items:center;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.8) 0 2px,transparent 3px),
    radial-gradient(circle at 80% 15%,rgba(255,255,255,.7) 0 2px,transparent 3px),
    linear-gradient(135deg,#ffd9e9 0%,#eadcff 48%,#d8e9ff 100%);
}
.bg-heart{position:fixed;color:#fff;opacity:.45;font-size:22px;animation:float 6s ease-in-out infinite;pointer-events:none}
.h1{animation-delay:-2s}.h2{animation-delay:-4s}
@keyframes float{50%{transform:translateY(-20px) rotate(8deg)}}
.card{
  position:relative;z-index:2;width:min(92vw,560px);min-height:430px;
  padding:34px 24px 28px;text-align:center;
  background:rgba(255,255,255,.78);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.9);border-radius:34px;
  box-shadow:0 25px 80px rgba(91,48,120,.22);
}
.badge{display:inline-block;padding:7px 13px;border-radius:99px;background:#fff;color:#8a4c9d;font-size:12px;font-weight:800;letter-spacing:1px}
.cake{font-size:64px;margin:12px 0 2px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.12))}
h1{margin:4px 0 8px;color:var(--dark);font-size:clamp(27px,7vw,38px)}
#message{margin:0 auto;max-width:440px;min-height:65px;color:#684f70;font-size:17px;line-height:1.55}
.arena{position:relative;height:135px;margin:14px auto 0;max-width:430px}
button{font:inherit;font-weight:900;border:0;cursor:pointer;border-radius:18px;padding:14px 34px;font-size:21px;box-shadow:0 10px 20px rgba(64,35,78,.15);transition:transform .15s,box-shadow .15s}
button:active{transform:scale(.94)}
#yes{position:absolute;left:25%;top:28px;background:linear-gradient(135deg,#ff5b98,#ff397e);color:#fff}
#no{position:absolute;left:58%;top:28px;background:#fff;color:#5d4865;border:2px solid #eadff0}
#no.crack1{box-shadow:0 0 0 3px #ffb0c9,0 10px 20px rgba(64,35,78,.15);transform:rotate(-8deg)}
#no.crack2{box-shadow:0 0 0 4px #ff7fa8,0 0 0 8px rgba(255,127,168,.22),0 10px 20px rgba(64,35,78,.15);transform:rotate(9deg)}
#no.crack3{box-shadow:0 0 0 4px #ff557f,0 0 0 10px rgba(255,85,127,.3),0 10px 20px rgba(64,35,78,.15);transform:rotate(-12deg)}
#no.broken{background:linear-gradient(135deg,#eee,#d6d0d8);color:#777;box-shadow:none;transform:rotate(16deg) scale(.82);text-decoration:line-through;pointer-events:none;opacity:.8}
.small{font-size:12px;color:#967f9e}
.hidden{display:none!important}
.success h1{font-size:clamp(30px,8vw,45px);color:#ed3f80}
.success .cake{font-size:82px;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-9px) rotate(2deg)}}
.piece{position:fixed;top:-40px;z-index:10;font-size:24px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.15}}
.spark{position:fixed;z-index:3;width:7px;height:7px;border-radius:50%;background:#fff;animation:spark .7s ease-out forwards;pointer-events:none}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.crack-line{position:absolute;width:28px;height:4px;background:#777;transform-origin:left center;opacity:.85;pointer-events:none}
</style>
</head>
<body>
<div class="bg-heart" style="left:8%;top:15%">♥</div>
<div class="bg-heart h1" style="right:10%;top:25%">✦</div>
<div class="bg-heart h2" style="left:13%;bottom:15%">✦</div>

<main class="card" id="card">
  <div class="badge">KÜÇÜK BİR SORU</div>
  <div class="cake">🎂</div>
  <h1 id="title">Bugün ayın kaçı?</h1>
  <p id="message">Doğru cevabı seç bakalım...<br><b>Bugün özel bir gün olabilir mi?</b></p>

  <div class="arena" id="arena">
    <button id="yes">2</button>
    <button id="no">3</button>
  </div>
  <div class="small" id="hint">Bir düşün bakalım 👀</div>
</main>

<script>
const yes=document.getElementById("yes");
const no=document.getElementById("no");
const arena=document.getElementById("arena");
const card=document.getElementById("card");
const title=document.getElementById("title");
const message=document.getElementById("message");
const hint=document.getElementById("hint");
let wrong=0;

function sparks(x,y){
  for(let i=0;i<10;i++){
    const s=document.createElement("span"); s.className="spark";
    s.style.left=x+"px"; s.style.top=y+"px";
    s.style.setProperty("--dx",(Math.random()*100-50)+"px");
    s.style.setProperty("--dy",(Math.random()*100-50)+"px");
    document.body.appendChild(s); setTimeout(()=>s.remove(),800);
  }
}

function moveNo(){
  const rect=arena.getBoundingClientRect();
  const maxX=Math.max(5,arena.clientWidth-no.offsetWidth-5);
  const maxY=Math.max(5,arena.clientHeight-no.offsetHeight-5);
  no.style.left=Math.random()*maxX+"px";
  no.style.top=Math.random()*maxY+"px";
  sparks(rect.left+rect.width/2,rect.top+35);
}

no.addEventListener("click",()=>{
  wrong++;
  const r=no.getBoundingClientRect();
  sparks(r.left+r.width/2,r.top+r.height/2);

  if(wrong===1){
    no.className="crack1";
    message.textContent="Ciddimisin? 😡";
    hint.textContent="Olmadı... tekrar dene.";
    moveNo();
  } else if(wrong===2){
    no.className="crack2";
    message.textContent="Ciddimisin? 😡";
    hint.textContent="Buton çatlamaya başladı...";
    moveNo();
  } else if(wrong===3){
    no.className="crack3";
    message.textContent="Ciddimisin? 😡";
    hint.textContent="Son şansın...";
    moveNo();
  } else {
    no.className="broken";
    message.innerHTML="<b>Butonu kırdın, aferin sana 😡</b>";
    hint.textContent="Artık doğru cevabı seçebilirsin.";
    sparks(r.left+r.width/2,r.top+r.height/2);
  }
});

yes.addEventListener("click",()=>{
  card.classList.add("success");
  title.textContent="İYİ Kİ DOĞDUNNNN!";
  message.innerHTML="<b>Doğum günün kutlu olsun Nisa! 🎂</b><br>Evettt! Bugün senin doğum günün!<br>Umarım yeni yaşın sana bolca mutluluk, kahkaha ve güzel anılar getirir. ❤️";
  arena.classList.add("hidden");
  hint.textContent="Bugün tamamen senin günün! 🎁";
  celebrate();
});

function celebrate(){
  const items=["🎉","🎊","🎂","🎈","💖","✨","🩷","🌸","⭐"];
  for(let i=0;i<90;i++){
    const p=document.createElement("span"); p.className="piece";
    p.textContent=items[Math.floor(Math.random()*items.length)];
    p.style.left=Math.random()*100+"vw";
    p.style.setProperty("--x",(Math.random()*180-90)+"px");
    p.style.animationDuration=(2.2+Math.random()*2.5)+"s";
    p.style.animationDelay=Math.random()*1.2+"s";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),6000);
  }
}
</script>
</body>
</html>
